worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream grabmedia_app {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Header di sicurezza di base
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- POST /download -> FastAPI ---------------------------------------
        location = /download {
            proxy_pass http://grabmedia_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- GET /download/{job_id}/{filename}: file protetti da Basic Auth ---
        location ~ ^/download/[0-9a-f]{32}/.+$ {
            auth_basic           "GrabMedia";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://grabmedia_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming dei file grandi senza bufferizzare su disco
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout       600s;
            proxy_send_timeout       600s;
        }

        # --- API REST -> FastAPI ---------------------------------------------
        # File prodotti dai provider audio (façade core.api). Niente Basic Auth qui:
        # l'accesso è protetto dall'app con il cookie di sessione (POST /login).
        location ~ ^/audio/[0-9a-f]{32}/file/[0-9]+$ {
            proxy_pass http://grabmedia_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location ~ ^/(audio|login|logout|session|status|jobs|cleanup|health|docs|openapi\.json|redoc)(/|$) {
            proxy_pass http://grabmedia_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket /ws/{job_id} -------------------------------------------
        location /ws/ {
            proxy_pass http://grabmedia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- File statici (frontend) ------------------------------------------
        location / {
            try_files $uri $uri/ =404;
            expires 1h;
        }
    }
}
